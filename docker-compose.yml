services:
  delivery-svc:
    build:
      context: .
      dockerfile: Dockerfile
    image: duoc/delivery-svc:${IMAGE_TAG:-latest}
    container_name: delivery-svc-app
    ports:
      - "8080:8080"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/entregas"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
