name: CI/CD Pipeline - Delivery Service

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  # ========================================================
  # IE2: Pruebas Automatizadas y Cobertura de Código
  # ========================================================
  test:
    name: Pruebas Unitarias y Cobertura (IE2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ejecutar pruebas unitarias, BDD Cucumber y verificar JaCoCo (100%)
        run: mvn -B clean verify

      - name: Publicar reporte de cobertura JaCoCo como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 7

  # ========================================================
  # IE3: Seguridad de Dependencias y Código (Snyk Gating)
  # ========================================================
  security:
    name: Análisis de Seguridad y Gating (IE3)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Validar presencia de SNYK_TOKEN
        run: |
          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "::error title=Falta SNYK_TOKEN::El secreto SNYK_TOKEN no está configurado en GitHub."
            echo "Ve a Settings -> Secrets and variables -> Actions y agrégalo con tu token de snyk.io."
            exit 1
          else
            echo "SNYK_TOKEN detectado correctamente."
          fi

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Resolver dependencias de Maven
        run: mvn -B dependency:resolve

      - name: Instalar Snyk CLI oficial
        uses: snyk/actions/setup@v4

      - name: Snyk - Escaneo SCA de dependencias con bloqueo por severidad High/Critical
        run: snyk test --file=pom.xml --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk - Escaneo SAST de código estático con bloqueo
        run: snyk code test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ========================================================
  # IE1: Construcción y Empaquetado de Imagen Docker Optimizada
  # ========================================================
  build:
    name: Construcción de Imagen Docker Optimizada (IE1)
    runs-on: ubuntu-latest
    needs: [test, security]

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker multi-stage
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            duoc/delivery-svc:${{ github.sha }}
            duoc/delivery-svc:latest

  # ========================================================
  # IE4: Despliegue Automático en Entorno Simulado y Trazabilidad
  # ========================================================
  deploy:
    name: Despliegue Automático Simulado y Trazabilidad (IE4)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Desplegar contenedores con Docker Compose
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Iniciando despliegue de versión SHA: ${{ github.sha }}"
          docker compose up -d --build

      - name: Esperar inicialización y verificar Healthcheck (Smoke Test)
        run: |
          echo "Esperando a que el servicio esté saludable..."
          for i in {1..30}; do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' delivery-svc-app 2>/dev/null || echo "starting")
            echo "Intento $i: Estado del contenedor = $STATUS"
            if [ "$STATUS" = "\"healthy\"" ]; then
              echo "Contenedor saludable."
              break
            fi
            sleep 2
          done

      - name: Verificación post-despliegue del endpoint REST
        run: |
          echo "Probando endpoint /api/entregas..."
          curl --fail --retry 5 --retry-delay 2 http://localhost:8080/api/entregas || exit 1
          echo "Endpoint respondió correctamente."

      - name: Resumen de Trazabilidad del Despliegue
        run: |
          echo "=========================================="
          echo "DESPLIEGUE COMPLETADO CON ÉXITO"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Disparado por: ${{ github.actor }}"
          echo "Fecha: $(date -u)"
          echo "=========================================="
