global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'delivery-svc'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 3s
    static_configs:
      - targets: ['delivery-svc:8080', 'host.docker.internal:8080']

  - job_name: 'pushgateway'
    honor_labels: true
    scrape_interval: 3s
    static_configs:
      - targets: ['pushgateway:9091']
